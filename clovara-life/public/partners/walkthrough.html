<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clovara — Platform Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6F3EB;
    --cream-2:#EFEBE0;
    --card:#FFFFFF;
    --ink:#1B1E1B;
    --ink-2:#5C635C;
    --ink-3:#8A918A;
    --forest:#1A5C38;
    --forest-deep:#0F3D26;
    --sage:#E4EAE0;
    --sage-2:#D5DFD0;
    --line:#E5E1D5;
    --orange:#D98A26;
    --amber:#B27117;
    --grad:linear-gradient(140deg,#D98A26 0%,#8FA83E 48%,#1E7A46 100%);
    --radius:20px;
    --shadow:0 18px 50px rgba(27,30,27,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Poppins',system-ui,sans-serif;
    background:var(--cream);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .serif{font-family:'Playfair Display',Georgia,serif}

  /* ---------- presentation shell ---------- */
  .shell{height:100vh;display:flex;flex-direction:column}
  header.top{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 40px 14px;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand .word{font-family:'Playfair Display',serif;font-weight:700;font-size:26px;letter-spacing:.2px}
  .preview-tag{
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);
    border:1px solid var(--line);border-radius:999px;padding:7px 16px;background:var(--card);
  }
  main.stage{
    flex:1;display:flex;align-items:center;justify-content:center;gap:64px;
    padding:0 48px 12px;min-height:0;
  }

  /* ---------- phone ---------- */
  .phone-wrap{flex:0 0 auto;display:flex;align-items:center;justify-content:center;height:100%}
  .phone{
    width:375px;height:770px;max-height:calc(100vh - 170px);
    background:var(--cream);
    border-radius:48px;
    border:10px solid #101310;
    box-shadow:var(--shadow), 0 2px 0 rgba(255,255,255,.6) inset;
    overflow:hidden;position:relative;
    transform-origin:center center;
  }
  .statusbar{
    height:44px;display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;font-size:12px;font-weight:600;color:var(--ink);
    position:relative;z-index:5;
  }
  .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);
    width:110px;height:26px;background:#101310;border-radius:999px;z-index:6}
  .screens{position:absolute;inset:44px 0 74px;overflow:hidden}
  .screen{
    position:absolute;inset:0;overflow-y:auto;padding:6px 18px 22px;
    opacity:0;transform:translateX(24px);pointer-events:none;
    transition:opacity .32s ease,transform .32s ease;
    scrollbar-width:none;
  }
  .screen::-webkit-scrollbar{display:none}
  .screen.active{opacity:1;transform:none;pointer-events:auto}
  @media (prefers-reduced-motion:reduce){.screen{transition:none}}

  /* ---------- phone bottom nav ---------- */
  .tabbar{
    position:absolute;left:0;right:0;bottom:0;height:74px;background:var(--card);
    border-top:1px solid var(--line);display:flex;z-index:5;
  }
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:9.5px;font-weight:500;color:var(--ink-3);cursor:pointer;border:none;background:none;
    font-family:inherit;
  }
  .tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tab.on{color:var(--forest)}
  .tab.on svg{stroke-width:2.1}

  /* ---------- shared app components ---------- */
  .card{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid rgba(229,225,213,.7)}
  .card + .card{margin-top:12px}
  .app-h1{font-family:'Playfair Display',serif;font-size:24px;font-weight:600;line-height:1.15}
  .app-sub{font-size:12px;color:var(--ink-2);margin-top:2px}
  .eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;
    padding:4px 10px;border-radius:999px}
  .chip.green{background:var(--sage);color:var(--forest-deep)}
  .chip.amber{background:#F6E8D2;color:var(--amber)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:none;border-radius:999px;font-family:inherit;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--forest);color:#fff;padding:11px 18px;font-size:12.5px}
  .btn.dark{background:#151815;color:#fff;padding:11px 18px;font-size:12.5px}
  .btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink);padding:10px 16px;font-size:12.5px}
  .btn.small{padding:8px 14px;font-size:11.5px}
  .avatar{
    width:52px;height:52px;border-radius:18px;background:var(--grad);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .avatar-inner{width:44px;height:44px;border-radius:14px;background:var(--cream);
    display:flex;align-items:center;justify-content:center;font-size:24px}
  .row{display:flex;align-items:center;gap:12px}
  .grow{flex:1;min-width:0}
  .divider{height:1px;background:var(--line);margin:12px 0}

  /* ---------- screen 1 dashboard ---------- */
  .score-hero{display:flex;align-items:center;gap:18px}
  .ring-wrap{position:relative;width:108px;height:108px;flex-shrink:0}
  .ring-wrap svg{transform:rotate(-90deg)}
  .ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring-num .n{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .ring-num .l{font-size:7.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:3px;font-weight:600;line-height:1.35;text-align:center;max-width:75px}
  /* DESIGN.md §5: the micro-label is two centred lines — one line clips the stroke.
     75px = inner diameter (2 × (47 − 4.5)) − 10. */
  .mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .mini{background:var(--cream);border-radius:14px;padding:10px 12px}
  .mini .v{font-family:'Playfair Display',serif;font-weight:700;font-size:17px}
  .mini .k{font-size:9.5px;color:var(--ink-2);margin-top:1px}
  .nudge{border-left:3px solid var(--orange);background:#FBF4E7}
  .spark{margin-top:8px}

  /* ---------- screen 2 chat ---------- */
  .chat-flow{display:flex;flex-direction:column;gap:10px;padding-top:6px}
  .bubble{max-width:82%;padding:11px 14px;border-radius:18px;font-size:12.5px;line-height:1.5}
  .bubble.user{align-self:flex-end;background:var(--forest);color:#fff;border-bottom-right-radius:6px}
  .bubble.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
  .bubble.ai .ref{
    margin-top:8px;padding:8px 10px;background:var(--sage);border-radius:10px;
    font-size:11px;color:var(--forest-deep);display:flex;gap:7px;align-items:flex-start;
  }
  .bubble.ai .ref svg{width:13px;height:13px;flex-shrink:0;margin-top:1px;stroke:var(--forest-deep);fill:none;stroke-width:2}
  .chat-actions{display:flex;gap:8px;flex-wrap:wrap;align-self:flex-start;max-width:85%}
  .chat-note{font-size:9.5px;color:var(--ink-3);text-align:center;padding:4px 20px 0;line-height:1.5}
  .typebar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:8px 8px 8px 16px;margin-top:12px;color:var(--ink-3);font-size:12px}
  .typebar .send{width:32px;height:32px;border-radius:999px;background:var(--forest);display:flex;
    align-items:center;justify-content:center;flex-shrink:0}
  .typebar .send svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}

  /* ---------- screen 3 rewards ---------- */
  .points-hero{background:var(--forest-deep);color:#fff;border:none;position:relative;overflow:hidden}
  .points-hero .glow{position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;
    background:radial-gradient(circle,rgba(217,138,38,.35),transparent 70%)}
  .points-hero .n{font-family:'Playfair Display',serif;font-size:38px;font-weight:700;line-height:1}
  .streaks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
  .streak{background:var(--cream);border-radius:14px;padding:10px;text-align:center}
  .streak .d{font-family:'Playfair Display',serif;font-weight:700;font-size:18px}
  .streak .k{font-size:9px;color:var(--ink-2);margin-top:2px;line-height:1.3}
  .redeem{display:flex;align-items:center;gap:12px;padding:11px 0}
  .redeem + .redeem{border-top:1px solid var(--line)}
  .redeem .ico{width:38px;height:38px;border-radius:12px;background:var(--sage);display:flex;
    align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
  .redeem .t{font-size:12.5px;font-weight:600}
  .redeem .s{font-size:10.5px;color:var(--ink-2)}
  .pts{font-size:11px;font-weight:700;color:var(--forest);white-space:nowrap}

  /* ---------- screen 4 shop ---------- */
  .shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .product{background:var(--card);border:1px solid rgba(229,225,213,.7);border-radius:18px;padding:12px;position:relative}
  .product .img{height:74px;border-radius:12px;background:var(--sage);display:flex;align-items:center;
    justify-content:center;font-size:30px;margin-bottom:9px}
  .product .why{position:absolute;top:8px;left:8px;right:8px;font-size:8.5px;font-weight:600;
    background:rgba(255,255,255,.92);border-radius:8px;padding:3px 7px;color:var(--forest-deep)}
  .product .t{font-size:11.5px;font-weight:600;line-height:1.3}
  .product .p{margin-top:5px;font-size:11px;color:var(--ink-3)}
  .product .p b{color:var(--forest);font-size:12.5px}
  .product .p s{margin-left:5px;font-size:10px}
  .member-strip{background:var(--sage);border:none;display:flex;align-items:center;gap:10px;padding:12px 14px}
  .member-strip .t{font-size:11.5px;font-weight:600;color:var(--forest-deep);line-height:1.4}

  /* ---------- screen 5 coverage ---------- */
  .plan-card{background:var(--forest);color:#fff;border:none;position:relative;overflow:hidden}
  .plan-card .cl{position:absolute;right:-24px;bottom:-34px;opacity:.14;transform:rotate(12deg);filter:brightness(3)}
  .plan-card .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;font-weight:600}
  .plan-card .t{font-family:'Playfair Display',serif;font-size:21px;font-weight:600;margin-top:4px}
  .plan-card .meta{display:flex;gap:18px;margin-top:14px}
  .plan-card .meta .v{font-weight:700;font-size:14px}
  .plan-card .meta .l{font-size:9.5px;opacity:.75;margin-top:1px}
  .claim-step{display:flex;gap:12px}
  .claim-step .dotcol{display:flex;flex-direction:column;align-items:center}
  .claim-step .dot{width:12px;height:12px;border-radius:50%;background:var(--forest);flex-shrink:0;margin-top:3px}
  .claim-step .dot.open{background:var(--card);border:2.5px solid var(--sage-2)}
  .claim-step .stem{width:2px;flex:1;background:var(--line);margin:3px 0}
  .claim-step .t{font-size:12.5px;font-weight:600}
  .claim-step .s{font-size:10.5px;color:var(--ink-2);margin-top:1px;padding-bottom:14px}
  .rider-line{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:12px}
  .rider-line + .rider-line{border-top:1px solid var(--line)}
  .rider-line .amt{font-weight:700;color:var(--forest)}

  /* ---------- screen 6 longevity ---------- */
  .life-head{display:flex;align-items:baseline;justify-content:space-between}
  .life-track{position:relative;margin:4px 0 0 7px;padding-left:24px}
  .life-track::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;
    background:linear-gradient(180deg,#D98A26,#8FA83E 45%,#1E7A46)}
  .stage{position:relative;padding:0 0 18px}
  .stage::before{content:"";position:absolute;left:-30px;top:4px;width:13px;height:13px;border-radius:50%;
    background:var(--cream);border:3px solid var(--forest)}
  .stage.past::before{background:var(--forest)}
  .stage.future::before{border-color:var(--sage-2)}
  .stage .yr{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .stage .t{font-size:13px;font-weight:600;margin-top:1px}
  .stage .s{font-size:11px;color:var(--ink-2);margin-top:2px;line-height:1.5}
  .proj{background:var(--sage);border:none}
  .proj .n{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--forest-deep)}

  /* ---------- narrative panel ---------- */
  aside.narrative{flex:0 1 430px;max-width:430px;min-width:0}
  .n-eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--orange);font-weight:600}
  .n-title{font-family:'Playfair Display',serif;font-size:40px;font-weight:600;line-height:1.1;margin-top:10px}
  .n-desc{font-size:14.5px;line-height:1.7;color:var(--ink-2);margin-top:16px}
  .n-points{margin-top:22px;display:flex;flex-direction:column;gap:12px}
  .n-point{display:flex;gap:12px;align-items:flex-start;font-size:13px;line-height:1.55}
  .n-point .mark{width:20px;height:20px;flex-shrink:0;margin-top:1px}
  footer.nav{
    display:flex;align-items:center;justify-content:center;gap:14px;
    padding:14px 40px 22px;
  }
  .navpills{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:5px}
  .navpill{border:none;background:none;font-family:inherit;font-size:12px;font-weight:600;
    color:var(--ink-2);padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .navpill.on{background:var(--ink);color:#fff}
  .arrow{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    cursor:pointer;display:flex;align-items:center;justify-content:center}
  .arrow svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .arrow:hover{background:var(--cream-2)}
  button:focus-visible,.tab:focus-visible{outline:2.5px solid var(--forest);outline-offset:2px}

  @media (max-width:1120px){
    aside.narrative{display:none}
    main.stage{gap:0}
  }
  @media (max-height:860px){
    .phone{transform:scale(.86)}
  }
  @media (max-height:760px){
    .phone{transform:scale(.76)}
  }
</style>
</head>

<!-- The clover gradient, for the score ring only. The mark itself is mark.svg,
     a byte-for-byte copy of assets/images/clovara_mark_refined.svg (DESIGN.md §1). -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="cloverGrad" x1="0.15" y1="0" x2="0.85" y2="1">

      <stop offset="0.5" stop-color="#8FA83E"/>
      <stop offset="1" stop-color="#1E7A46"/>

  </defs>
</svg>

<div class="shell">
  <header class="top">
    <div class="brand">
      <img src="mark.svg" alt="" width="34" height="34">
      <span class="word">Clovara</span>

    <div class="preview-tag">Platform concept · Investor preview</div>

  <main class="stage">
    <div class="phone-wrap">
      <div class="phone" role="region" aria-label="Clovara app mockup">
        <div class="notch"></div>
        <div class="statusbar"><span>9:41</span><span style="letter-spacing:2px">▪▪▪ ⏻</span></div>

        <div class="screens" id="screens"></div>

        <nav class="tabbar" id="tabbar" aria-label="App navigation"></nav>
      </div>
    </div>

    <aside class="narrative" aria-live="polite">
      <div class="n-eyebrow" id="nEyebrow"></div>
      <h1 class="n-title serif" id="nTitle"></h1>
      <p class="n-desc" id="nDesc"></p>
      <div class="n-points" id="nPoints"></div>
    </aside>
  </main>

  <footer class="nav">
    <button class="arrow" id="prevBtn" aria-label="Previous screen">
      <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div class="navpills" id="navpills" role="tablist"></div>
    <button class="arrow" id="nextBtn" aria-label="Next screen">
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </footer>
</div>

  home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  chat:'<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/></svg>',

  life:'<svg viewBox="0 0 24 24"><path d="M12 21C7 16.5 3 13 3 9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 4-4 7.5-9 12z"/></svg>'
};

/* ---------- build ---------- */
const screensEl = document.getElementById('screens');
const tabbarEl  = document.getElementById('tabbar');
const pillsEl   = document.getElementById('navpills');

SCREENS.forEach((s,i)=>{
  const sc = document.createElement('div');
  sc.className = 'screen'; sc.id = 'screen-'+s.id;
  sc.innerHTML = TEMPLATES[s.id];
  screensEl.appendChild(sc);

  if(!s.sub){
    const tab = document.createElement('button');
    tab.className = 'tab'; tab.dataset.key = s.id;
    tab.innerHTML = TAB_ICONS[s.id] + '<span>'+s.tab+'</span>';
    tab.addEventListener('click', ()=>go(i));
    tabbarEl.appendChild(tab);
  }

  const pill = document.createElement('button');
  pill.className = 'navpill'; pill.textContent = s.tab; pill.setAttribute('role','tab');
  pill.addEventListener('click', ()=>go(i));
  pillsEl.appendChild(pill);
});

const nEyebrow = document.getElementById('nEyebrow');
const nTitle   = document.getElementById('nTitle');
const nDesc    = document.getElementById('nDesc');
const nPoints  = document.getElementById('nPoints');
const CHECK = '<img src="mark.svg" alt="" class="mark">';

let cur = 0;
function go(i){
  cur = (i + SCREENS.length) % SCREENS.length;
  const s = SCREENS[cur];
  const key = s.sub || s.id;
  document.querySelectorAll('.screen').forEach((el,j)=>el.classList.toggle('active', j===cur));
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('on', el.dataset.key===key));
  document.querySelectorAll('.navpill').forEach((el,j)=>el.classList.toggle('on', j===cur));
  nEyebrow.textContent = s.eyebrow;
  nTitle.textContent   = s.title;
  nDesc.textContent    = s.desc;
  nPoints.innerHTML    = s.points.map(p=>'<div class="n-point">'+CHECK+'<span>'+p+'</span></div>').join('');
  document.querySelector('.screen.active').scrollTop = 0;
}
document.getElementById('prevBtn').addEventListener('click', ()=>go(cur-1));
document.getElementById('nextBtn').addEventListener('click', ()=>go(cur+1));
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') go(cur+1);
  if(e.key==='ArrowLeft')  go(cur-1);
});
go(0);
</script>
