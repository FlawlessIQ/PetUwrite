<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F3EB" />

    <title>Clovara Life — your pet's healthy years, mapped</title>
    <meta
      name="description"
      content="Clovara Life projects a pet's healthy years and lays out a stage-by-stage care plan that adapts as they age."
    />

    <!-- If the site is created under a different name, update these two URLs. -->
    <meta property="og:url" content="https://clovara-life.web.app/" />
    <meta property="og:image" content="https://clovara-life.web.app/og.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clovara" />
    <meta property="og:title" content="Clovara Life — your pet's healthy years, mapped" />
    <meta
      property="og:description"
      content="A projection of the years your pet is likely to spend in good health, and a care plan that adapts as they age."
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clovara Life — your pet's healthy years, mapped" />
    <meta
      name="twitter:description"
      content="A projection of the years your pet is likely to spend in good health, and a care plan that adapts as they age."
    />
    <meta name="twitter:image" content="https://clovara-life.web.app/og.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Clovara Life" />

    <style>
      /* Inlined so the first paint is branded rather than a blank rectangle,
         however slow the JS is. React replaces #boot on mount. */
      html,
      body {
        margin: 0;
        background: #f6f3eb;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: Georgia, 'Times New Roman', serif;
        color: #1b1e1b;
      }
      #boot p {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #6b716c;
      }
      @media (prefers-reduced-motion: no-preference) {
        #boot svg {
          animation: boot-pulse 1.8s ease-in-out infinite;
        }
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <svg width="46" height="46" viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <linearGradient id="bg" x1="8%" y1="0%" x2="82%" y2="100%">
              <stop offset="0%" stop-color="#D98A26" />
              <stop offset="48%" stop-color="#8FA83E" />
              <stop offset="100%" stop-color="#1E7A46" />
            </linearGradient>
          </defs>
          <path
            fill="url(#bg)"
            fill-rule="evenodd"
            d="M15.4,15.6a8.6,8.6 0 1,0 17.2,0a8.6,8.6 0 1,0 -17.2,0 M23.8,24a8.6,8.6 0 1,0 17.2,0a8.6,8.6 0 1,0 -17.2,0 M15.4,32.4a8.6,8.6 0 1,0 17.2,0a8.6,8.6 0 1,0 -17.2,0 M7,24a8.6,8.6 0 1,0 17.2,0a8.6,8.6 0 1,0 -17.2,0 M21.5,14a2.5,2.5 0 1,0 5,0a2.5,2.5 0 1,0 -5,0 M31.5,24a2.5,2.5 0 1,0 5,0a2.5,2.5 0 1,0 -5,0 M21.5,34a2.5,2.5 0 1,0 5,0a2.5,2.5 0 1,0 -5,0 M11.5,24a2.5,2.5 0 1,0 5,0a2.5,2.5 0 1,0 -5,0"
          />
        </svg>
        <p>Clovara Life</p>
      </div>
    </div>

    <noscript>
      <div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
          background: #f6f3eb;
          font-family: system-ui, -apple-system, sans-serif;
          color: #1b1e1b;
          text-align: center;
          line-height: 1.6;
        "
      >
        <p style="max-width: 34ch">
          Clovara Life needs JavaScript to work out your pet's projection. Please enable it and
          reload.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
